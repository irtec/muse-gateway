name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Cargo.toml Version & GitHub Releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          TAG="v${CARGO_VERSION}"
          echo "Current workspace version in Cargo.toml: ${CARGO_VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on GitHub. Skipping release build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New unreleased version detected: ${TAG}! Triggering release build..."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build & Publish Release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p muse-agent
          cargo build --release --target x86_64-unknown-linux-musl -p muse-hub

      - name: Prepare release artifacts & checksums
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-musl/release/muse-agent artifacts/muse-agent
          cp target/x86_64-unknown-linux-musl/release/muse-hub artifacts/muse-hub
          echo "${VERSION}" > artifacts/version.txt
          cd artifacts
          sha256sum muse-agent | awk '{print $1}' > muse-agent.sha256
          sha256sum muse-hub | awk '{print $1}' > muse-hub.sha256
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Release ${{ needs.check-version.outputs.tag }}
          files: |
            artifacts/muse-agent
            artifacts/muse-hub
            artifacts/muse-agent.sha256
            artifacts/muse-hub.sha256
            artifacts/version.txt
          draft: false
          prerelease: false
          generate_release_notes: true


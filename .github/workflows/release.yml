name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Musl Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Determine & validate version
        id: get_version
        run: |
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "Cargo.toml workspace version is: ${CARGO_VERSION}"

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          VERSION="${TAG#v}"
          if [ "${VERSION}" != "${CARGO_VERSION}" ]; then
            echo "ERROR: Git tag version (${VERSION}) does not match Cargo.toml version (${CARGO_VERSION})!"
            echo "Please update [workspace.package] version in Cargo.toml to match ${VERSION} before releasing."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "${VERSION}" > version.txt

      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p muse-agent
          cargo build --release --target x86_64-unknown-linux-musl -p muse-hub

      - name: Prepare release artifacts & checksums
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-musl/release/muse-agent artifacts/muse-agent
          cp target/x86_64-unknown-linux-musl/release/muse-hub artifacts/muse-hub
          cp version.txt artifacts/version.txt
          cd artifacts
          sha256sum muse-agent | awk '{print $1}' > muse-agent.sha256
          sha256sum muse-hub | awk '{print $1}' > muse-hub.sha256
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          files: |
            artifacts/muse-agent
            artifacts/muse-hub
            artifacts/muse-agent.sha256
            artifacts/muse-hub.sha256
            artifacts/version.txt
          draft: false
          prerelease: false
          generate_release_notes: true
